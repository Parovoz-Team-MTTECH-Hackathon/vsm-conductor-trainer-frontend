<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" type="text/css" href="login.css">
</head>
<body>
    <div class="auth-container">
        <form class="auth-form" id="login-form">
            <!-- Кнопка назад -->
            <button type="button" class="back-btn" onclick="history.back()">← Назад</button>

            <h2 class="form-title">Авторизация</h2>

            <!-- Блок ошибок -->
            <div id="err" class="error-box"></div>

            <!-- Email -->
            <div class="field-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" required placeholder="name@example.com" />
            </div>

            <!-- Пароль -->
            <div class="field-group password-row">
                <div class="input-wrapper">
                    <label for="pass">Пароль</label>
                    <input type="password" id="pass" name="password" required placeholder="••••••••" />
                </div>
                <button type="button" id="show-pass" class="toggle-btn eye-btn" aria-label="Показать пароль"></button>
            </div>

            <!-- Кнопка отправки -->
            <button type="button" id="send" class="submit-btn">Войти</button>
        </form>
    </div>

    <script type="module" src="login.js"></script>

    <script>
        function togglePassword(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            if (!input || !btn) return;

            let isShown = false;

            btn.addEventListener('click', () => {
                isShown = !isShown;
                input.type = isShown ? 'text' : 'password';
                btn.classList.toggle('active', isShown);
            });
        }

        togglePassword('pass', 'show-pass');
    </script>
</body>
</html>
