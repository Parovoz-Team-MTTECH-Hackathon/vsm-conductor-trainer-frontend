<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <form onsubmit="return false;">
        <h2>Авторизация</h2>
        <div id="err"></div>

        <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required />
        </div>

        <div class="field-group password-row">
            <div>
                <label for="pass">Пароль</label>
                <input type="password" id="pass" name="password" required />
            </div>
            <button type="button" id="show-pass" class="toggle-btn" aria-label="Показать пароль"></button>
        </div>

        <button type="button" id="send" class="submit-btn">Отправить</button>
    </form>

    <script type="module" src="login.js"></script>

    <script>
        const input = document.getElementById('pass');
        const btn = document.getElementById('show-pass');
        let isShown = false;

        btn.addEventListener('click', () => {
            isShown = !isShown;
            input.type = isShown ? 'text' : 'password';
            btn.dataset.shown = isShown;
        });
    </script>
</body>
</html>
