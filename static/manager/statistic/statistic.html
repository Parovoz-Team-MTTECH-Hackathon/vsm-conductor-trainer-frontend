<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статистика игрока</title>
  <link rel="stylesheet" type="text/css" href="statistic.css">
</head>
<body>
  <div class="stat-container">
    <div class="nav-row">
      <button class="back-btn" onclick="history.back()">← Назад</button>
      <a class="back-link" href="players.html">К списку игроков</a>
    </div>

    <h1 class="page-title">Статистика игрока</h1>

    <div id="status" class="loading">Загрузка…</div>

    <div id="content" hidden>
      <!-- ===== Карточка статистики ===== -->
      <div class="card">
        <div class="row">
          <span class="label">ID игрока:</span>
          <span class="value" id="player_id"></span>
        </div>
        <div class="row">
          <span class="label">Счёт:</span>
          <span class="value" id="score"></span>
        </div>
        <div class="row">
          <span class="label">Пройдено сценариев:</span>
          <span class="value" id="completed-count"></span>
        </div>
        <div id="completed-wrap" class="scenarios"></div>
      </div>

      <!-- ===== Достижения ===== -->
      <h2 class="sub-title">Достижения</h2>

      <div id="achievements-wrap">
        <div class="table-wrapper">
          <table id="achievements-table" class="ach" hidden>
            <thead>
              <tr>
                <th>Иконка</th>
                <th>ID сценария</th>
                <th>Название</th>
                <th>Метка</th>
                <th>Описание</th>
                <th>Δ Очков</th>
              </tr>
            </thead>
            <tbody id="achievements-body"></tbody>
          </table>
        </div>
        <div id="achievements-empty" class="empty" hidden>Достижений нет</div>
      </div>
    </div>
  </div>

  <script type="module" src="statistic.js"></script>
</body>
</html>
