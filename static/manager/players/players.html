<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игроки</title>
  <link rel="stylesheet" type="text/css" href="players.css">
</head>
<body>
  <div class="players-container">

    <button class="back-btn" onclick="history.back()">← Назад</button>

    <h1 class="page-title">Список игроков</h1>

    <div id="status" class="loading">Загрузка…</div>

    <div class="table-wrapper">
      <table id="players-table" class="players-table" hidden>
        <thead>
          <tr>
            <th>Статистика</th>
            <th>Кик</th>
            <th>ID клиента</th>
            <th>Активен</th>
            <th>Тип клиента</th>
            <th>Email</th>
            <th>Тип пользователя</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Отчество</th>
          </tr>
        </thead>
        <tbody id="players-body"></tbody>
      </table>
    </div>

  </div>

  <script type="module" src="players.js"></script>
</body>
</html>
