<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
</head>
<body>
    <div id="profile">
      <p>Client ID: <span id="client_id"></span></p>
      <p>Is Active: <span id="is_active"></span></p>
      <p>Client Type: <span id="client_type"></span></p>
      <p>Email: <span id="email"></span></p>
      <p>User Type: <span id="user_type"></span></p>
      <p>Name: <span id="name"></span> <button id="edit-name"></button></p>
    </div>

    <div class="invite">
      <h2>Пригласительная ссылка для игроков</h2>
      <div class="invite-row">
        <div class="invite-link" id="invite-link">—</div>
        <button id="copy-invite" class="btn" disabled>Копировать</button>
      </div>
      <div class="hint">Отправьте эту ссылку игроку — он попадёт на страницу регистрации по вашему ID.</div>
    </div>

    <script type="module" src="profile.js"></script>
</body>
</html>
