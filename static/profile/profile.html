<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль игрока</title>
    <link rel="stylesheet" type="text/css" href="profile.css">
</head>
<body>
    <div class="profile-container">
        <button class="back-btn" onclick="history.back()">← Назад</button>

        <h1 class="page-title">Профиль игрока</h1>

        <!-- ===== ПРОФИЛЬ ===== -->
        <div id="profile" class="profile-card">
            <div class="profile-row">
                <span class="label">ID клиента:</span>
                <span class="value" id="client_id"></span>
            </div>
            <div class="profile-row">
                <span class="label">Активен:</span>
                <span class="value" id="is_active"></span>
            </div>
            <div class="profile-row">
                <span class="label">Тип клиента:</span>
                <span class="value" id="client_type"></span>
            </div>
            <div class="profile-row">
                <span class="label">Email:</span>
                <span class="value" id="email"></span>
            </div>
            <div class="profile-row">
                <span class="label">Тип пользователя:</span>
                <span class="value" id="user_type"></span>
            </div>

            <div class="profile-row editable">
                <span class="label">Имя:</span>
                <span class="value" id="first_name"></span>
                <button id="first" class="btn">Изменить</button>
            </div>
            <div class="profile-row editable">
                <span class="label">Фамилия:</span>
                <span class="value" id="last_name"></span>
                <button id="last" class="btn">Изменить</button>
            </div>
            <div class="profile-row editable">
                <span class="label">Отчество:</span>
                <span class="value" id="patronymic_name"></span>
                <button id="patr" class="btn">Изменить</button>
            </div>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="panel">
            <h2 class="panel-title">Статистика</h2>

            <div id="stat-status" class="loading">Загрузка…</div>

            <div id="stat-content" hidden>
                <div class="card">
                    <div class="card-row"><span class="label">Имя:</span> <span class="value" id="stat_name"></span></div>
                    <div class="card-row"><span class="label">ID игрока:</span> <span class="value" id="stat_player_id"></span></div>
                    <div class="card-row"><span class="label">Счёт:</span> <span class="value" id="stat_score"></span></div>
                    <div class="card-row">
                        <span class="label">Пройдено сценариев:</span>
                        <span class="value" id="stat_completed_count"></span>
                    </div>
                    <div id="stat_completed" class="chips"></div>
                </div>

                <h3 class="sub-title">Достижения</h3>

                <div id="stat-ach-status" class="loading">Загрузка…</div>

                <div class="table-wrapper">
                    <table id="stat-ach-table" class="ach" hidden>
                        <thead>
                            <tr>
                                <th>Иконка</th>
                                <th>ID сценария</th>
                                <th>Название</th>
                                <th>Метка</th>
                                <th>Описание</th>
                                <th>Δ Очков</th>
                            </tr>
                        </thead>
                        <tbody id="stat-ach-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="profile.js"></script>
</body>
</html>
