<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль администратора</title>
    <link rel="stylesheet" type="text/css" href="profile.css">
</head>
<body>
    <div class="admin-container">

        <button class="back-btn" onclick="history.back()">← Назад</button>

        <h1 class="page-title">Профиль администратора</h1>

        <!-- ===== ПРОФИЛЬ ===== -->
        <div id="profile" class="profile-card">
            <div class="profile-row">
                <span class="label">ID клиента:</span>
                <span class="value" id="client_id"></span>
            </div>
            <div class="profile-row">
                <span class="label">Активен:</span>
                <span class="value" id="is_active"></span>
            </div>
            <div class="profile-row">
                <span class="label">Тип клиента:</span>
                <span class="value" id="client_type"></span>
            </div>
            <div class="profile-row">
                <span class="label">Email:</span>
                <span class="value" id="email"></span>
            </div>
            <div class="profile-row">
                <span class="label">Тип пользователя:</span>
                <span class="value" id="user_type"></span>
            </div>
        </div>

        <!-- ===== СЦЕНАРИИ ===== -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Сценарии</h2>
                <div class="panel-actions">
                    <button id="refresh-scenarios" class="btn btn-ghost" title="Обновить список">↻ Обновить</button>
                    <button id="create-scenario" class="btn btn-primary">+ Создать сценарий</button>
                </div>
            </div>

            <div id="scenario-error" class="error-banner" hidden></div>

            <div id="scenario-list" class="scenario-list">
                <div class="empty">Загрузка…</div>
            </div>
        </div>

        <!-- ===== МОДЕРИРОВАНИЕ ===== -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Модерирование</h2>
            </div>
            <div class="panel-actions">
                <a href="../players/players.html" class="btn btn-secondary">Игроки</a>
                <a href="../managers/managers.html" class="btn btn-secondary">Менеджеры</a>
                <a href="../integrations/integrations.html" class="btn btn-secondary">Интеграции</a>
            </div>
        </div>

    </div>

    <script type="module" src="profile.js"></script>
</body>
</html>
