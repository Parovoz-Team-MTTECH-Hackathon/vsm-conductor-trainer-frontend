<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Профиль администратора</title>
</head>
<body>
  <h1>Профиль администратора</h1>

  <div id="profile">
    <p><span class="label">Client ID:</span> <span class="value" id="client_id"></span></p>
    <p><span class="label">Is Active:</span> <span class="value" id="is_active"></span></p>
    <p><span class="label">Client Type:</span> <span class="value" id="client_type"></span></p>
    <p><span class="label">Email:</span> <span class="value" id="email"></span></p>
    <p><span class="label">User Type:</span> <span class="value" id="user_type"></span></p>
  </div>

  <!-- ===== СЦЕНАРИИ ===== -->
  <div class="panel">
    <div class="scenarios-header">
      <h2>Сценарии</h2>
      <button id="create-scenario" class="btn primary">Создать сценарий</button>
    </div>

    <div id="scenario-error" class="error" hidden></div>

    <div id="scenario-list" class="scenario-list">
      <div class="empty">Загрузка…</div>
    </div>
  </div>

  <!-- ===== МОДЕРИРОВАНИЕ ===== -->
  <div class="panel">
    <h2>Модерирование</h2>
    <div class="scenario-list">
      <a href="../players/players.html" class="btn secondary">Игроки</a>
      <a href="../managers/managers.html" class="btn secondary">Менеджеры</a>
      <a href="../integrations/integrations.html" class="btn secondary">Интеграции</a>
    </div>
  </div>

  <script type="module" src="profile.js"></script>
</body>
</html>
