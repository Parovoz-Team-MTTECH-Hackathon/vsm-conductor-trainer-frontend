<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интеграции (админ)</title>
    <link rel="stylesheet" type="text/css" href="integrations.css">
</head>
<body>
    <div class="integrations-container">

        <button class="back-btn" onclick="history.back()">← Назад</button>

        <h1 class="page-title">Список интеграций</h1>

        <div id="status" class="loading">Загрузка…</div>

        <div class="table-wrapper">
            <table id="integrations-table" class="integrations-table" hidden>
                <thead>
                    <tr>
                        <th>Действия</th>
                        <th>ID клиента</th>
                        <th>Активен</th>
                        <th>Тип клиента</th>
                        <th>Имя</th>
                        <th>Ключ</th>
                    </tr>
                </thead>
                <tbody id="integrations-body"></tbody>
            </table>
        </div>

    </div>

    <script type="module" src="integrations.js"></script>
</body>
</html>
