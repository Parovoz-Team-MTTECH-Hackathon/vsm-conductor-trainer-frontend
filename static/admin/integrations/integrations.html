<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Интеграции (админ)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }

    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: middle; }
    th { background: #f4f4f4; }
    tr:nth-child(even) { background: #fafafa; }

    .status-active { color: green; font-weight: 600; }
    .status-inactive { color: #b00; font-weight: 600; }

    .error { color: #b00; margin: 10px 0; }
    .loading { color: #666; }

    .actions { display: flex; gap: 10px; align-items: center; }
    .actions input[type="checkbox"] { transform: scale(1.3); cursor: pointer; }

    .del-btn {
      background: #d33; color: #fff; border: none;
      padding: 4px 10px; border-radius: 4px; cursor: pointer;
      font-size: 13px;
    }
    .del-btn:hover { background: #b00; }
    .del-btn:disabled { background: #999; cursor: not-allowed; }

    .toggle-label { font-size: 12px; color: #666; user-select: none; }

    .key-cell { display: flex; gap: 6px; align-items: center; }
    .key-cell code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
      vertical-align: middle;
    }
    .copy-btn {
      background: #06c; color: #fff; border: none;
      padding: 4px 10px; border-radius: 4px; cursor: pointer;
      font-size: 12px;
    }
    .copy-btn:hover { background: #048; }
    .copy-btn.copied { background: #2a2; }
  </style>
</head>
<body>
  <h1>Список интеграций</h1>

  <div id="status" class="loading">Загрузка…</div>

  <table id="integrations-table" hidden>
    <thead>
      <tr>
        <th>Действия</th>
        <th>Client ID</th>
        <th>Активен</th>
        <th>Тип клиента</th>
        <th>Имя</th>
        <th>Ключ</th>
      </tr>
    </thead>
    <tbody id="integrations-body"></tbody>
  </table>

  <script type="module" src="integrations.js"></script>
</body>
</html>
