<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджеры</title>
    <link rel="stylesheet" type="text/css" href="managers.css">
</head>
<body>
    <div class="managers-container">

        <button class="back-btn" onclick="history.back()">← Назад</button>

        <div class="panel-header">
            <h1 class="page-title">Список менеджеров</h1>
            <div class="panel-actions">
                <a href="sign-up/sign-up.html" class="btn btn-primary">+ Зарегистрировать</a>
            </div>
        </div>

        <div id="status" class="loading">Загрузка…</div>

        <div class="table-wrapper">
            <table id="managers-table" class="managers-table" hidden>
                <thead>
                    <tr>
                        <th>Действия</th>
                        <th>ID клиента</th>
                        <th>Активен</th>
                        <th>Тип клиента</th>
                        <th>Email</th>
                        <th>Тип пользователя</th>
                        <th>Имя</th>
                    </tr>
                </thead>
                <tbody id="managers-body"></tbody>
            </table>
        </div>

    </div>

    <script type="module" src="managers.js"></script>
</body>
</html>
