<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация менеджера</title>
    <link rel="stylesheet" type="text/css" href="sign-up.css">
</head>
<body>
    <div class="auth-container">
        <form class="auth-form" id="manager-signup-form">

            <button type="button" class="back-btn" onclick="history.back()">← Назад</button>

            <h2 class="form-title">Регистрация менеджера</h2>

            <!-- Блок ошибок -->
            <div id="err" class="error-box"></div>

            <!-- Email -->
            <div class="field-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com" />
            </div>

            <!-- Пароль -->
            <div class="field-group password-row">
                <div class="input-wrapper">
                    <label for="pass">Пароль</label>
                    <input type="password" id="pass" name="password" required placeholder="••••••••" />
                </div>
                <button type="button" id="show-pass" class="toggle-btn eye-btn" aria-label="Показать пароль"></button>
            </div>

            <!-- Повтор пароля -->
            <div class="field-group password-row">
                <div class="input-wrapper">
                    <label for="pass-rep">Повторить пароль</label>
                    <input type="password" id="pass-rep" name="password-repeat" required placeholder="••••••••" />
                </div>
                <button type="button" id="show-pass-rep" class="toggle-btn eye-btn" aria-label="Показать пароль"></button>
            </div>

            <!-- Имя -->
            <div class="field-group">
                <label for="name">Имя</label>
                <input type="text" id="name" name="name" required placeholder="Пётр" />
            </div>

            <!-- Кнопка отправки -->
            <button type="button" id="send" class="submit-btn">Зарегистрировать</button>
        </form>
    </div>

    <script type="module" src="sign-up.js"></script>

    <script>
        function togglePassword(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            if (!input || !btn) return;

            let isShown = false;

            btn.addEventListener('click', () => {
                isShown = !isShown;
                input.type = isShown ? 'text' : 'password';
                btn.classList.toggle('active', isShown);
            });
        }

        togglePassword('pass', 'show-pass');
        togglePassword('pass-rep', 'show-pass-rep');
    </script>
</body>
</html>
