<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация менеджера</title>
    <link rel="stylesheet" type="text/css" href="sign-up.css">
</head>
<body>
    <form>
        <h2>Регистрация менеджера</h2>

        <div id="err"></div>

        <div class="field-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com" />
        </div>

        <div class="field-group password-row">
            <div style="flex-grow: 1;">
                <label for="password">Пароль:</label>
                <input type="password" id="pass" name="password" required />
            </div>
            <button type="button" id="show-pass" class="toggle-btn"></button>
        </div>

        <div class="field-group password-row">
            <div style="flex-grow: 1;">
                <label for="password-repeat">Повторить пароль:</label>
                <input type="password" id="pass-rep" name="password-repeat" required />
            </div>
            <button type="button" id="show-pass-rep" class="toggle-btn"></button>
        </div>

        <div class="field-group">
            <label for="name">Имя:</label>
            <input type="text" id="name" name="name" required />
        </div>

        <button type="button" id="send" class="toggle-btn">Отправить</button>
    </form>

    <script type="module" src="sign-up.js"></script>

    <script>
        function togglePassword(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            if (!input || !btn) return;

            let isShown = false;

            btn.addEventListener('click', () => {
                isShown = !isShown;
                input.type = isShown ? 'text' : 'password';
                btn.dataset.shown = isShown;
            });
        }

        togglePassword('pass', 'show-pass');
        togglePassword('pass-rep', 'show-pass-rep');
    </script>
</body>
</html>
