<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игроки (админ)</title>
    <link rel="stylesheet" type="text/css" href="players.css">
</head>
<body>
    <div class="admin-players-container">

        <button class="back-btn" onclick="history.back()">← Назад</button>

        <h1 class="page-title">Список игроков</h1>

        <div id="status" class="loading">Загрузка…</div>

        <div class="table-wrapper">
            <table id="players-table" class="players-table" hidden>
                <thead>
                    <tr>
                        <th>Действия</th>
                        <th>ID клиента</th>
                        <th>Активен</th>
                        <th>Тип клиента</th>
                        <th>Email</th>
                        <th>Тип пользователя</th>
                        <th>Имя</th>
                        <th>Фамилия</th>
                        <th>Отчество</th>
                    </tr>
                </thead>
                <tbody id="players-body"></tbody>
            </table>
        </div>

    </div>

    <script type="module" src="players.js"></script>
</body>
</html>
